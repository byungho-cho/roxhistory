name: Presentation PDFs

on:
  push:
    paths:
      - '**/*.pdf'
      - '.github/workflows/presentation-pdfs.yml'
  pull_request:
    paths:
      - '**/*.pdf'
      - '.github/workflows/presentation-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-pdfs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/presentation_pdf_requirements.txt
      - name: Validate PDF deliverables without PPTX conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          files = sorted(Path('presentations').glob('*.pdf'))
          if not files:
              raise SystemExit('No presentation PDFs found')
          for path in files:
              reader = PdfReader(path, strict=True)
              if not reader.pages:
                  raise SystemExit(f'Empty PDF: {path}')
              for page in reader.pages:
                  if float(page.mediabox.width) <= 0 or float(page.mediabox.height) <= 0:
                      raise SystemExit(f'Invalid page size: {path}')
                  page.get_contents()
              print(f'{path}: {len(reader.pages)} pages OK')
          PY
