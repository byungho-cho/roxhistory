name: Presentation source review
on:
  push:
    paths: ['.github/workflows/presentation-source-review.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Prepare image references
        run: |
          python - <<'PY'
          import base64, io
          from PIL import Image
          for i in range(1,4):
              image = Image.open(f'assets/visual-direction-{i}.png').convert('RGB')
              image.thumbnail((1400,1000))
              output = io.BytesIO()
              image.save(output, format='JPEG', quality=94)
              print(f'SOURCE_IMAGE:{i}:' + base64.b64encode(output.getvalue()).decode())
          PY
