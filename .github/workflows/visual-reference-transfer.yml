name: Prepare visual concept reference
on:
  push:
    paths: ['.github/workflows/visual-reference-transfer.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Encode the existing concept for design review
        run: |
          python - <<'PY'
          import base64, io
          from PIL import Image
          image = Image.open('assets/visual-direction-1-enhanced.png').convert('RGB')
          image.thumbnail((1280,720))
          output = io.BytesIO()
          image.save(output, format='JPEG', quality=75)
          print('CONCEPT_IMAGE:' + base64.b64encode(output.getvalue()).decode())
          print('CONCEPT_SIZE:' + str(image.width) + ':' + str(image.height))
          PY
