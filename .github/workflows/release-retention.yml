name: Audit Android and Windows release assets

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-asset-retention
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/keep-latest-release.ps1
          sparse-checkout-cone-mode: false
      - name: Report older release assets without deleting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/keep-latest-release.ps1 -Repository '${{ github.repository }}'
